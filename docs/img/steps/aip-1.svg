<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <rect width="320" height="200" rx="20" fill="#f3ece1"/>
  <!-- accents -->
  <circle cx="46" cy="46" r="6" fill="#f3b45f"/>
  <circle cx="276" cy="42" r="5" fill="#cfe7dd"/>
  <circle cx="58" cy="148" r="3" fill="#f3b45f"/>
  <!-- ground -->
  <ellipse cx="160" cy="170" rx="116" ry="12" fill="#e4d8c8"/>
  <!-- five pages fanned behind the front one, pivoting on its base -->
  <g transform="rotate(-21 160 150)">
    <rect x="124" y="60" width="72" height="90" rx="6" fill="#fffaf3" stroke="#e4d8c8" stroke-width="3"/>
  </g>
  <g transform="rotate(16 160 150)">
    <rect x="124" y="60" width="72" height="90" rx="6" fill="#fffaf3" stroke="#e4d8c8" stroke-width="3"/>
  </g>
  <g transform="rotate(-14 160 150)">
    <rect x="124" y="60" width="72" height="90" rx="6" fill="#ffffff" stroke="#e4d8c8" stroke-width="3"/>
  </g>
  <g transform="rotate(8 160 150)">
    <rect x="124" y="60" width="72" height="90" rx="6" fill="#ffffff" stroke="#e4d8c8" stroke-width="3"/>
  </g>
  <g transform="rotate(-7 160 150)">
    <rect x="124" y="60" width="72" height="90" rx="6" fill="#fffaf3" stroke="#e4d8c8" stroke-width="3"/>
  </g>
  <!-- front page -->
  <rect x="124" y="65" width="72" height="100" rx="6" fill="#e4d8c8"/>
  <rect x="124" y="60" width="72" height="100" rx="6" fill="#ffffff"/>
  <rect x="136" y="74" width="26" height="10" rx="3" fill="#0f6b52"/>
  <path d="M136 98h48M136 110h48M136 122h36M136 134h48M136 146h26" stroke="#e4d8c8" stroke-width="4" stroke-linecap="round"/>
  <!-- paper clip over the top edge -->
  <path d="M178 74V52a6 6 0 0 1 12 0v32a10 10 0 0 1-20 0V60" fill="none" stroke="#0f6b52" stroke-width="4" stroke-linecap="round"/>
  <!-- magnifier (checking nothing is missing) -->
  <path d="M258 146 272 162" stroke="#8a3d14" stroke-width="8" stroke-linecap="round"/>
  <circle cx="246" cy="134" r="17" fill="#c98f3e"/>
  <circle cx="246" cy="130" r="17" fill="#f3b45f"/>
  <circle cx="246" cy="130" r="11" fill="#e8f1ec"/>
  <path d="M240 128a7 7 0 0 1 6-6" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
