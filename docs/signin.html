<!DOCTYPE html>
<html lang="en-IE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | ÉireHome Flow</title>
  <link rel="stylesheet" href="css/styles.css?v=20260924">
  <script src="js/config.js?v=20260924" defer></script>
  <script src="js/account.js?v=20260924" defer></script>
  <script src="js/app.js?v=20260924" defer></script>
  <script src="js/pages/auth.js?v=20260924" defer></script>
</head>
<body data-page="signin">
<div class="page">

  <div data-include="partials/header.html"></div>

  <main class="main main--auth">
    <div class="auth-card">
      <p class="eyebrow">Your account</p>
      <h1 class="auth-card__title">Sign in</h1>
      <p class="auth-card__intro">Sign in to see your saved journey.</p>
      <p class="auth-card__note" id="auth-note" data-bind="authNote" hidden></p>
      <div class="auth-card__links" id="auth-note-links" hidden>
        <a class="btn btn--primary" href="dashboard.html">Go to my dashboard</a>
      </div>
      <form class="auth-form" id="auth-form" novalidate data-fields="email password" data-password="current">
          <label class="field">
            <span class="field__label">Email</span>
            <input type="email" name="email" autocomplete="email" aria-describedby="error-email">
            <span class="field__error" id="error-email"></span>
          </label>
          <label class="field">
            <span class="field__label">Password</span>
            <input type="password" name="password" autocomplete="current-password" aria-describedby="error-password">
            <span class="field__error" id="error-password"></span>
          </label>
          <p class="form-status" role="status" aria-live="polite"></p>
          <button type="submit" class="btn btn--primary auth-form__submit">Sign in</button>
      </form>
      <p class="auth-card__switch"><a href="forgot-password.html">Forgot your password?</a></p>
      <p class="auth-card__switch">New here? <a href="signup.html" data-keep-next>Create an account</a></p>
      <p class="auth-card__privacy">Your account stores your name, your email and the steps you have completed, on servers in Ireland. Calculator figures stay in your browser. <a href="privacy.html">Read our Privacy Policy</a>.</p>
    </div>
  </main>

  <div data-include="partials/footer.html"></div>

</div>
</body>
</html>
