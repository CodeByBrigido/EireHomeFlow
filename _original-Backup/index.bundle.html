document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

nter;gap:18px;flex:none\">\n        <button type=\"button\" sc-camel-on-click=\"{{ goHome }}\" style=\"{{ navHomeStyle }}\">Home<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ goJourney }}\" style=\"{{ navJourneyStyle }}\">My journey<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ goCalc }}\" style=\"{{ navCalcStyle }}\">Calculator<\u002Fbutton>\n        <span style=\"display:flex;align-items:center;justify-content:flex-end;gap:6px;min-width:74px;font-weight:800;font-size:15px;color:#ffd79a\">★ {{ streak }}<\u002Fspan>\n        <span style=\"display:flex;align-items:center;justify-content:flex-end;gap:6px;min-width:74px;font-weight:800;font-size:15px\">{{ xp }} XP<\u002Fspan>\n        <button type=\"button\" style=\"padding:8px 18px;border-radius:999px;border:2px solid rgba(255,250,243,.5);background:none;color:#fffaf3;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer\" style-hover=\"background:rgba(255,250,243,.12)\">Sign in<\u002Fbutton>\n      <\u002Fnav>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <sc-if value=\"{{ onHome }}\" hint-placeholder-val=\"{{ true }}\">\n  <main style=\"flex:1\">\n    <section style=\"max-width:1160px;margin:0 auto;padding:56px 32px 0\">\n      <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:56px;align-items:center\">\n        <div>\n          <p style=\"margin:0 0 12px;font-weight:800;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:#b3521f\">For first-time buyers in Ireland<\u002Fp>\n          <h1 style=\"margin:0;font-weight:800;font-size:66px;line-height:1;letter-spacing:-0.03em;text-wrap:pretty\">From first savings<br>to your <em style=\"font-style:italic;color:#0f6b52\">first sofa<\u002Fem>.<\u002Fh1>\n          <p style=\"margin:20px 0 26px;font-size:18px;line-height:1.6;color:#6b5a48;max-width:40ch\">Six phases, thirty steps. The deposit maths, the AIP paperwork, the bidding, the keys — and everything after: floors, curtains, the boiler service nobody warns you about.<\u002Fp>\n          <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n            <button type=\"button\" sc-camel-on-click=\"{{ goJourney }}\" style=\"padding:14px 26px;border:0;border-radius:999px;background:#0f6b52;color:#fffaf3;font-family:inherit;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 5px 0 #0a4c3a;transition:transform .12s\" style-hover=\"filter:brightness(1.07)\" style-active=\"transform:translateY(4px)\">{{ resumeLabel }}<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ goCalc }}\" style=\"padding:14px 26px;border:2px solid #e4d8c8;border-radius:999px;background:#fff;color:#5c4a38;font-family:inherit;font-weight:700;font-size:16px;cursor:pointer\" style-hover=\"background:#f7efe3\">Buying power calculator<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <figure style=\"margin:0\">\n          <img src=\"b54c80af-74cd-4e45-8bf0-8c42922bc4af\" alt=\"Illustrated Irish home above the coast\" style=\"display:block;width:100%;height:auto;border-radius:24px\">\n          <figcaption style=\"margin-top:10px;font-size:13px;color:#8a7a66\">Where the keys eventually go.<\u002Ffigcaption>\n        <\u002Ffigure>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"margin-top:52px;background:#0f6b52;color:#fffaf3;overflow:hidden\">\n      <div style=\"display:flex;width:max-content;gap:44px;padding:12px 0;white-space:nowrap;animation:eh-marquee 38s linear infinite\">\n        <sc-for list=\"{{ tickerLoop }}\" as=\"item\" hint-placeholder-count=\"6\">\n          <span style=\"display:flex;align-items:center;gap:44px;font-weight:700;font-size:14px\">{{ item.text }}<span style=\"width:6px;height:6px;border-radius:50%;background:#f3b45f\"><\u002Fspan><\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"max-width:1160px;margin:0 auto;padding:56px 32px 0\">\n      <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px\">\n        <div style=\"padding:26px;border-radius:22px;background:#fff;border:2px solid #efe2d1\">\n          <p style=\"margin:0;font-weight:800;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#8a7a66\">Maximum mortgage<\u002Fp>\n          <p style=\"margin:10px 0 0;font-weight:800;font-size:56px;line-height:1;letter-spacing:-0.03em;color:#0f6b52\">4×<\u002Fp>\n          <p style=\"margin:8px 0 0;font-size:15px;line-height:1.5;color:#6b5a48\">Gross annual income, per Central Bank of Ireland rules.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding:26px;border-radius:22px;background:#fff;border:2px solid #efe2d1\">\n          <p style=\"margin:0;font-weight:800;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#8a7a66\">Minimum deposit<\u002Fp>\n          <p style=\"margin:10px 0 0;font-weight:800;font-size:56px;line-height:1;letter-spacing:-0.03em;color:#0f6b52\">10%<\u002Fp>\n          <p style=\"margin:8px 0 0;font-size:15px;line-height:1.5;color:#6b5a48\">First-time buyers; 20% if you have owned before.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding:26px;border-radius:22px;background:#b3521f;color:#fffaf3\">\n          <p style=\"margin:0;font-weight:800;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;opacity:.85\">Cash outside the loan<\u002Fp>\n          <p style=\"margin:10px 0 0;font-weight:800;font-size:56px;line-height:1;letter-spacing:-0.03em\">€3,550<\u002Fp>\n          <p style=\"margin:8px 0 0;font-size:15px;line-height:1.5;opacity:.92\">Solicitor, survey and valuation — plus 1% stamp duty.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"max-width:1160px;margin:0 auto;padding:64px 32px 90px\">\n      <h2 style=\"margin:0;font-weight:800;font-size:42px;line-height:1.05;letter-spacing:-0.025em\">Six phases, one path.<\u002Fh2>\n      <p style=\"margin:10px 0 0;font-size:16px;color:#6b5a48;max-width:52ch\">Clear the blocking steps in a phase and the next node lights up. Your streak keeps count.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:30px\">\n        <sc-for list=\"{{ phaseRows }}\" as=\"row\" hint-placeholder-count=\"6\">\n          <button type=\"button\" sc-camel-on-click=\"{{ row.open }}\" style=\"{{ row.cardStyle }}\" style-hover=\"transform:translateY(-3px)\">\n            <span style=\"display:flex;align-items:center;gap:14px\">\n              <span style=\"{{ row.badgeStyle }}\">{{ row.n }}<\u002Fspan>\n              <span style=\"font-weight:800;font-size:21px;line-height:1.15\">{{ row.title }}<\u002Fspan>\n            <\u002Fspan>\n            <span style=\"display:block;margin-top:12px;font-size:15px;line-height:1.5;color:#6b5a48\">{{ row.text }}<\u002Fspan>\n            <span style=\"display:block;margin-top:14px;height:8px;border-radius:999px;background:#f0e5d6\">\n              <span style=\"{{ row.barStyle }}\"><\u002Fspan>\n            <\u002Fspan>\n            <span style=\"display:block;margin-top:8px;font-weight:700;font-size:13px;color:#0f6b52\">{{ row.progress }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ onJourney }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"flex:1;max-width:1160px;margin:0 auto;padding:40px 32px 110px;width:100%;box-sizing:border-box\">\n    <div style=\"{{ journeyGridStyle }}\">\n      <div>\n        <div style=\"{{ journeyHeadStyle }}\">\n          <p style=\"margin:0 0 10px;font-weight:800;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:#b3521f\">Your journey<\u002Fp>\n          <h1 style=\"margin:0;font-weight:800;font-size:48px;line-height:1.02;letter-spacing:-0.03em\">The road to the keys — and past them<\u002Fh1>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:44px\">\n          <sc-for list=\"{{ journey }}\" as=\"phase\" hint-placeholder-count=\"6\">\n            <section style=\"margin-bottom:20px\">\n              <div style=\"display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:18px;background:#f3ece1\">\n                <span style=\"{{ phase.badgeStyle }}\">{{ phase.n }}<\u002Fspan>\n                <span style=\"flex:1;min-width:0\">\n                  <span style=\"display:block;font-weight:800;font-size:21px;line-height:1.15\">{{ phase.title }}<\u002Fspan>\n                  <span style=\"display:block;font-size:13px;color:#8a7a66\">{{ phase.subtitle }}<\u002Fspan>\n                <\u002Fspan>\n                <span style=\"font-weight:800;font-size:14px;color:#0f6b52\">{{ phase.pctLabel }}<\u002Fspan>\n              <\u002Fdiv>\n\n              <ol style=\"list-style:none;margin:22px 0 40px;padding:0;display:flex;flex-direction:column;align-items:center;gap:24px\">\n                <sc-for list=\"{{ phase.tasks }}\" as=\"task\" hint-placeholder-count=\"5\">\n                  <li style=\"{{ task.liStyle }}\">\n                    <span style=\"{{ task.calloutStyle }}\">{{ task.callout }}<\u002Fspan>\n                    <button type=\"button\" sc-camel-on-click=\"{{ task.open }}\" aria-label=\"{{ task.title }}\" style=\"{{ task.nodeStyle }}\" style-hover=\"filter:brightness(1.07)\" style-active=\"transform:translateY(4px)\">{{ task.glyph }}<\u002Fbutton>\n                    <span style=\"{{ task.labelStyle }}\">{{ task.title }}<\u002Fspan>\n                  <\u002Fli>\n                <\u002Fsc-for>\n              <\u002Fol>\n            <\u002Fsection>\n          <\u002Fsc-for>\n\n          <div style=\"display:flex;flex-direction:column;align-items:center;padding-top:8px\">\n            <span style=\"{{ finishStyle }}\">🔑<\u002Fspan>\n            <span style=\"margin-top:12px;font-weight:800;font-size:24px\">{{ finishTitle }}<\u002Fspan>\n            <span style=\"margin-top:4px;font-size:14px;color:#8a7a66\">{{ finishNote }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ hasOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"position:sticky;top:104px;padding:30px;border-radius:26px;background:#fff;border:2px solid #efe2d1\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px\">\n          <p style=\"margin:0;font-weight:800;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:#b3521f\">{{ openPhase }}<\u002Fp>\n          <button type=\"button\" sc-camel-on-click=\"{{ close }}\" style=\"padding:7px 16px;border:2px solid #e4d8c8;border-radius:999px;background:none;color:#8a7a66;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer\" style-hover=\"background:#f7efe3\">Close<\u002Fbutton>\n        <\u002Fdiv>\n        <p style=\"margin:12px 0 0;font-size:13px;font-weight:700;color:#7d6b55\">{{ openStepLabel }}<\u002Fp>\n        <h2 style=\"margin:6px 0 0;font-weight:800;font-size:34px;line-height:1.08;letter-spacing:-0.025em\">{{ openTitle }}<\u002Fh2>\n        <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:14px\">\n          <p style=\"{{ openTagStyle }}\">{{ openTag }}<\u002Fp>\n          <p style=\"margin:0;padding:5px 12px;border-radius:999px;background:#f3ece1;color:#6b5a48;font-weight:700;font-size:12px\">⏱ {{ openTime }}<\u002Fp>\n          <p style=\"margin:0;padding:5px 12px;border-radius:999px;background:#f3ece1;color:#6b5a48;font-weight:700;font-size:12px\">€ {{ openCost }}<\u002Fp>\n        <\u002Fdiv>\n        <p style=\"margin:18px 0 0;font-size:17px;line-height:1.6;color:#4a3d31\">{{ openBody }}<\u002Fp>\n\n        <p style=\"margin:26px 0 10px;font-weight:800;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#8a7a66\">What this takes<\u002Fp>\n        <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px\">\n          <sc-for list=\"{{ openChecklist }}\" as=\"item\" hint-placeholder-count=\"3\">\n            <li style=\"display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border-radius:16px;background:#fdfaf4;border:1px solid #f0e5d6\">\n              <span style=\"color:#0f6b52;font-weight:800\">◆<\u002Fspan>\n              <span style=\"font-size:15px;line-height:1.5;color:#4a3d31\">{{ item.text }}<\u002Fspan>\n            <\u002Fli>\n          <\u002Fsc-for>\n        <\u002Ful>\n\n        <div style=\"margin-top:20px;padding:16px 18px;border-radius:18px;background:#fdf2e4\">\n          <p style=\"margin:0;font-weight:800;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#8a5420\">Worth knowing<\u002Fp>\n          <p style=\"margin:7px 0 0;font-size:15px;line-height:1.55;color:#6b4a22\">{{ openTip }}<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:12px;margin-top:24px;flex-wrap:wrap\">\n          <button type=\"button\" sc-camel-on-click=\"{{ toggleOpen }}\" style=\"padding:13px 24px;border:0;border-radius:999px;background:#0f6b52;color:#fffaf3;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 5px 0 #0a4c3a\" style-active=\"transform:translateY(4px)\">{{ openAction }}<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ openPrev }}\" style=\"padding:13px 20px;border:2px solid #e4d8c8;border-radius:999px;background:none;color:#5c4a38;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer\" style-hover=\"background:#f7efe3\">← Previous<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ openNextStep }}\" style=\"padding:13px 20px;border:2px solid #e4d8c8;border-radius:999px;background:none;color:#5c4a38;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer\" style-hover=\"background:#f7efe3\">Next →<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <\u002Fsc-if>\n\n      <aside style=\"{{ asideStyle }}\">\n        <div style=\"padding:22px;border-radius:22px;background:#fff;border:2px solid #efe2d1\">\n          <div style=\"display:flex;align-items:center;gap:16px\">\n            <svg sc-camel-view-box=\"0 0 100 100\" style=\"width:84px;height:84px;flex:none\">\n              <circle cx=\"50\" cy=\"50\" r=\"43\" fill=\"none\" stroke=\"#f0e5d6\" stroke-width=\"11\"><\u002Fcircle>\n              <circle cx=\"50\" cy=\"50\" r=\"43\" fill=\"none\" stroke=\"#0f6b52\" stroke-width=\"11\" stroke-linecap=\"round\" transform=\"rotate(-90 50 50)\" stroke-dasharray=\"{{ ringDash }}\"><\u002Fcircle>\n            <\u002Fsvg>\n            <div>\n              <p style=\"margin:0;font-weight:800;font-size:34px;line-height:1;letter-spacing:-0.02em\">{{ pct }}<\u002Fp>\n              <p style=\"margin:4px 0 0;font-size:13px;color:#8a7a66\">{{ countLabel }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px\">\n            <div style=\"padding:12px 14px;border-radius:14px;background:#fdf2e4\">\n              <p style=\"margin:0;font-size:12px;font-weight:700;color:#8a7a66\">Streak<\u002Fp>\n              <p style=\"margin:4px 0 0;font-weight:800;font-size:22px;color:#b3521f\">{{ streak }}<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"padding:12px 14px;border-radius:14px;background:#e8f1ec\">\n              <p style=\"margin:0;font-size:12px;font-weight:700;color:#8a7a66\">Earned<\u002Fp>\n              <p style=\"margin:4px 0 0;font-weight:800;font-size:22px;color:#0f6b52\">{{ xp }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:16px;padding:22px;border-radius:22px;background:#0f6b52;color:#fffaf3\">\n          <p style=\"margin:0;font-size:12px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;opacity:.8\">Next up<\u002Fp>\n          <p style=\"margin:8px 0 0;font-weight:800;font-size:20px;line-height:1.2\">{{ nextTitle }}<\u002Fp>\n          <button type=\"button\" sc-camel-on-click=\"{{ openNext }}\" style=\"margin-top:14px;width:100%;padding:12px;border:0;border-radius:999px;background:#f3b45f;color:#2c2118;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 4px 0 #c98f3e\" style-active=\"transform:translateY(3px)\">Open this step<\u002Fbutton>\n        <\u002Fdiv>\n\n        <button type=\"button\" sc-camel-on-click=\"{{ reset }}\" style=\"margin-top:12px;width:100%;padding:11px;border:2px solid #e4d8c8;border-radius:999px;background:none;color:#8a7a66;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer\" style-hover=\"background:#f7efe3\">Reset progress<\u002Fbutton>\n      <\u002Faside>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ onCalc }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"flex:1;max-width:1160px;margin:0 auto;padding:40px 32px 100px;width:100%;box-sizing:border-box\">\n    <p style=\"margin:0 0 10px;font-weight:800;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:#b3521f\">Phase 01 — Financial diagnosis<\u002Fp>\n    <h1 style=\"margin:0;font-weight:800;font-size:48px;line-height:1.02;letter-spacing:-0.03em\">What you can actually buy<\u002Fh1>\n    <p style=\"margin:12px 0 0;font-size:16px;line-height:1.6;color:#6b5a48;max-width:62ch\">The Central Bank caps mortgages at 4× gross income for first-time buyers and 3.5× for everyone else. Fill in what you have; the numbers on the right update as you type.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:32px;margin-top:32px;align-items:start\">\n\n      <div style=\"padding:26px;border-radius:24px;background:#fff;border:2px solid #efe2d1;display:flex;flex-direction:column;gap:20px\">\n        <div style=\"display:flex;gap:10px\">\n          <button type=\"button\" sc-camel-on-click=\"{{ setFtb }}\" style=\"{{ ftbOnStyle }}\">First-time buyer<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ setMover }}\" style=\"{{ ftbOffStyle }}\">Moving home<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:10px\">\n          <button type=\"button\" sc-camel-on-click=\"{{ setSingle }}\" style=\"{{ singleStyle }}\">Buying alone<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ setJoint }}\" style=\"{{ jointStyle }}\">Joint application<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n          <label style=\"display:block\">\n            <span style=\"display:block;font-weight:700;font-size:13px;color:#6b5a48;margin-bottom:6px\">Your gross annual salary<\u002Fspan>\n            <input type=\"number\" min=\"0\" step=\"1000\" value=\"{{ fSalary }}\" sc-camel-on-input=\"{{ onSalary }}\" placeholder=\"45000\" style=\"width:100%;box-sizing:border-box;padding:12px 14px;border:2px solid #e4d8c8;border-radius:14px;background:#fffaf3;font-family:inherit;font-weight:700;font-size:16px;color:#2c2118\">\n          <\u002Flabel>\n          <label style=\"{{ partnerFieldStyle }}\">\n            <span style=\"display:block;font-weight:700;font-size:13px;color:#6b5a48;margin-bottom:6px\">Partner's gross salary<\u002Fspan>\n            <input type=\"number\" min=\"0\" step=\"1000\" value=\"{{ fSalary2 }}\" sc-camel-on-input=\"{{ onSalary2 }}\" placeholder=\"38000\" style=\"width:100%;box-sizing:border-box;padding:12px 14px;border:2px solid #e4d8c8;border-radius:14px;background:#fffaf3;font-family:inherit;font-weight:700;font-size:16px;color:#2c2118\">\n          <\u002Flabel>\n          <label style=\"display:block\">\n            <span style=\"display:block;font-weight:700;font-size:13px;color:#6b5a48;margin-bottom:6px\">Savings<\u002Fspan>\n            <input type=\"number\" min=\"0\" step=\"1000\" value=\"{{ fSavings }}\" sc-camel-on-input=\"{{ onSavings }}\" placeholder=\"30000\" style=\"width:100%;box-sizing:border-box;padding:12px 14px;border:2px solid #e4d8c8;border-radius:14px;background:#fffaf3;font-family:inherit;font-weight:700;font-size:16px;color:#2c2118\">\n          <\u002Flabel>\n          <label style=\"display:block\">\n            <span style=\"display:block;font-weight:700;font-size:13px;color:#6b5a48;margin-bottom:6px\">Family gift<\u002Fspan>\n            <input type=\"number\" min=\"0\" step=\"1000\" value=\"{{ fGift }}\" sc-camel-on-input=\"{{ onGift }}\" placeholder=\"0\" style=\"width:100%;box-sizing:border-box;padding:12px 14px;border:2px solid #e4d8c8;border-radius:14px;background:#fffaf3;font-family:inherit;font-weight:700;font-size:16px;color:#2c2118\">\n          <\u002Flabel>\n          <label style=\"{{ htbFieldStyle }}\">\n            <span style=\"display:block;font-weight:700;font-size:13px;color:#6b5a48;margin-bottom:6px\">Help to Buy relief<\u002Fspan>\n            <input type=\"number\" min=\"0\" step=\"1000\" value=\"{{ fHtb }}\" sc-camel-on-input=\"{{ onHtb }}\" placeholder=\"30000\" style=\"width:100%;box-sizing:border-box;padding:12px 14px;border:2px solid #e4d8c8;border-radius:14px;background:#fffaf3;font-family:inherit;font-weight:700;font-size:16px;color:#2c2118\">\n          <\u002Flabel>\n          <label style=\"display:block\">\n            <span style=\"display:block;font-weight:700;font-size:13px;color:#6b5a48;margin-bottom:6px\">Target house price<\u002Fspan>\n            <input type=\"number\" min=\"0\" step=\"5000\" value=\"{{ fPrice }}\" sc-camel-on-input=\"{{ onPrice }}\" placeholder=\"380000\" style=\"width:100%;box-sizing:border-box;padding:12px 14px;border:2px solid #e4d8c8;border-radius:14px;background:#fffaf3;font-family:inherit;font-weight:700;font-size:16px;color:#2c2118\">\n          <\u002Flabel>\n        <\u002Fdiv>\n\n        <p style=\"{{ htbHintStyle }}\">{{ htbHint }}<\u002Fp>\n\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;padding-top:4px;border-top:2px solid #f3ece1\">\n          <label style=\"display:block\">\n            <span style=\"display:block;font-weight:700;font-size:13px;color:#6b5a48;margin:10px 0 6px\">Interest rate (%)<\u002Fspan>\n            <input type=\"number\" min=\"0\" step=\"0.1\" value=\"{{ fRate }}\" sc-camel-on-input=\"{{ onRate }}\" style=\"width:100%;box-sizing:border-box;padding:12px 14px;border:2px solid #e4d8c8;border-radius:14px;background:#fffaf3;font-family:inherit;font-weight:700;font-size:16px;color:#2c2118\">\n          <\u002Flabel>\n          <label style=\"display:block\">\n            <span style=\"display:block;font-weight:700;font-size:13px;color:#6b5a48;margin:10px 0 6px\">Term (years)<\u002Fspan>\n            <input type=\"number\" min=\"5\" max=\"35\" step=\"1\" value=\"{{ fTerm }}\" sc-camel-on-input=\"{{ onTerm }}\" style=\"width:100%;box-sizing:border-box;padding:12px 14px;border:2px solid #e4d8c8;border-radius:14px;background:#fffaf3;font-family:inherit;font-weight:700;font-size:16px;color:#2c2118\">\n          <\u002Flabel>\n        <\u002Fdiv>\n\n        <p style=\"margin:0;font-size:13px;line-height:1.5;color:#8a7a66\">Educational estimates based on Central Bank of Ireland macroprudential rules. Each lender applies its own credit criteria and exemptions.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:16px\">\n        <div style=\"padding:26px;border-radius:24px;background:#0f6b52;color:#fffaf3\">\n          <p style=\"margin:0;font-weight:800;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;opacity:.82\">Maximum property price<\u002Fp>\n          <p style=\"margin:8px 0 0;font-weight:800;font-size:52px;line-height:1;letter-spacing:-0.03em\">{{ maxPrice }}<\u002Fp>\n          <p style=\"margin:8px 0 0;font-size:15px;line-height:1.5;opacity:.92\">{{ limitNote }}<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px\">\n            <div style=\"padding:14px;border-radius:16px;background:rgba(255,250,243,.14)\">\n              <p style=\"margin:0;font-size:12px;font-weight:700;opacity:.85\">Max mortgage ({{ multipleLabel }})<\u002Fp>\n              <p style=\"margin:4px 0 0;font-weight:800;font-size:22px\">{{ maxLoan }}<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"padding:14px;border-radius:16px;background:rgba(255,250,243,.14)\">\n              <p style=\"margin:0;font-size:12px;font-weight:700;opacity:.85\">Funds available<\u002Fp>\n              <p style=\"margin:4px 0 0;font-weight:800;font-size:22px\">{{ funds }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"padding:26px;border-radius:24px;background:#fff;border:2px solid #efe2d1\">\n          <p style=\"margin:0;font-weight:800;font-size:20px\">On a {{ priceLabel }} house<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:0;margin-top:14px\">\n            <sc-for list=\"{{ breakdown }}\" as=\"line\" hint-placeholder-count=\"7\">\n              <span style=\"{{ line.rowStyle }}\">\n                <span style=\"{{ line.labelStyle }}\">{{ line.label }}<\u002Fspan>\n                <span style=\"{{ line.valueStyle }}\">{{ line.value }}<\u002Fspan>\n              <\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <p style=\"margin:14px 0 0;font-size:13px;line-height:1.5;color:#8a7a66\">{{ bookingNote }}<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"{{ verdictStyle }}\">\n          <p style=\"margin:0;font-weight:800;font-size:18px\">{{ verdictTitle }}<\u002Fp>\n          <p style=\"margin:8px 0 0;font-size:15px;line-height:1.55\">{{ verdictBody }}<\u002Fp>\n          <button type=\"button\" sc-camel-on-click=\"{{ goJourney }}\" style=\"margin-top:16px;padding:12px 22px;border:0;border-radius:999px;background:#2c2118;color:#fffaf3;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer\" style-hover=\"filter:brightness(1.2)\">Back to my journey<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"padding:22px 26px;border-radius:24px;background:#f3ece1\">\n          <p style=\"margin:0;font-weight:800;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#8a7a66\">Estimated monthly repayment<\u002Fp>\n          <p style=\"margin:8px 0 0;font-weight:800;font-size:38px;line-height:1;letter-spacing:-0.02em;color:#0f6b52\">{{ monthly }}<\u002Fp>\n          <p style=\"margin:8px 0 0;font-size:14px;color:#6b5a48\">{{ monthlyNote }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <footer style=\"background:#f3ece1\">\n    <div style=\"max-width:1160px;margin:0 auto;padding:22px 32px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:13px;color:#8a7a66\">\n      <span style=\"font-weight:700\">ÉireHome Flow — Dublin<\u002Fspan>\n      <span>Educational content. Not regulated financial advice.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:880},&quot;accent&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Moss &amp; terracotta&quot;,&quot;Slate &amp; rust&quot;,&quot;Peat &amp; gold&quot;],&quot;default&quot;:&quot;Moss &amp; terracotta&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Look&quot;},&quot;nodeShape&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Round&quot;,&quot;Squircle&quot;],&quot;default&quot;:&quot;Round&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Look&quot;},&quot;buttonLift&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Pressed&quot;,&quot;Flat&quot;],&quot;default&quot;:&quot;Pressed&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Look&quot;}}\">\nconst TICKER = [\n  \"Central Bank rule: 4× gross income\",\n  \"First-time buyer deposit: 10%\",\n  \"Stamp duty: 1%\",\n  \"Solicitor: €2,000–3,000\",\n  \"Structural survey: ≈ €400\",\n  \"Bank valuation: ≈ €150\",\n];\n\nconst WAVE = [0, 72, 108, 72, 0, -72, -108, -72];\n\nconst T = (title, body, blocking, time, cost, checklist, tip) => ({ title, body, blocking, time, cost, checklist, tip });\n\nconst PHASES = [\n  { n: \"01\", slug: \"preparation\", title: \"Preparation\", subtitle: \"Getting the financial house in order\",\n    text: \"Buying power, deposit target and six clean months of statements.\",\n    tasks: [\n      T(\"Calculate my buying power\", \"The Central Bank of Ireland lets first-time buyers borrow up to four times gross annual income; movers are capped at 3.5×. Your income sets the ceiling, your cash sets the floor.\", true, \"1 evening\", \"Free\",\n        [\"Add both gross salaries if you are applying jointly\", \"Subtract any car loan or credit union repayment — lenders stress-test them\", \"Write down the maximum price the calculator gives you\"],\n        \"Lenders can grant exemptions above the multiple, but they are rationed each quarter and go early in the year.\"),\n      T(\"Confirm the 10% deposit\", \"First-time buyers need at least 10% of the purchase price. If you have owned before, it is 20%. The deposit is separate from the fees below.\", true, \"Ongoing\", \"10% of price\",\n        [\"Set a standing order the day after payday, not the day before\", \"Keep the deposit in a separate account you never touch\", \"A documented family gift counts, but the lender will want a letter saying it is not a loan\"],\n        \"Six months of regular saving at roughly your future repayment is the strongest thing on your file.\"),\n      T(\"Set aside cash for the extra costs\", \"Stamp duty, solicitor, survey and valuation are paid from your own cash, not the mortgage.\", true, \"Ongoing\", \"≈ €3,550 + 1% stamp duty\",\n        [\"Stamp duty: 1% of the price up to €1m\", \"Solicitor: €2,000–3,000 plus VAT and outlays\", \"Structural survey ≈ €400, bank valuation ≈ €150\"],\n        \"Budget another €1,500–2,000 for moving, locks and the first utility bills.\"),\n      T(\"Keep the bank account clean for six months\", \"Underwriters read six months of statements line by line and read them as a character reference.\", true, \"6 months\", \"Free\",\n        [\"No online betting transactions, at all\", \"No unauthorised overdrafts or returned direct debits\", \"Rent paid on time from the same account every month\"],\n        \"Revolut and credit union accounts count too — the lender will ask for those statements as well.\"),\n      T(\"Check Help to Buy eligibility\", \"Help to Buy refunds income tax and DIRT you already paid, up to €30,000 or 10% of the price, on new builds only.\", false, \"2 weeks\", \"Refund up to €30,000\",\n        [\"Apply through Revenue's myAccount and get your HTB code\", \"New builds and self-builds only — second-hand homes do not qualify\", \"The First Home Scheme is a separate shared-equity option worth pricing\"],\n        \"The refund goes to the developer as part of your deposit, so approval must be in place before you sign.\"),\n    ] },\n  { n: \"02\", slug: \"aip\", title: \"Approval in Principle\", subtitle: \"The letter that makes you real\",\n    text: \"Paperwork, bank or broker, and the letter agents ask for.\",\n    tasks: [\n      T(\"Choose a bank direct or a broker\", \"A broker compares the whole market in one application; going direct can win a lender-specific cashback offer.\", true, \"1 week\", \"Broker usually free to you\",\n        [\"Ask the broker which lenders they are on panel with\", \"Compare cashback against the rate — cashback is one payment, the rate is 30 years\", \"Check the lender's stance on your employment type before applying\"],\n        \"Contract or probation income is where lenders differ most; a broker earns their keep here.\"),\n      T(\"Gather six months of bank statements\", \"Every current, savings and Revolut account, complete, with no missing pages.\", true, \"2–3 days\", \"Free\",\n        [\"Download PDFs directly from the bank, not screenshots\", \"Label each file with the account and the month\", \"Be ready to explain any lodgement over about €500\"],\n        \"One missing page is the single most common cause of a stalled application.\"),\n      T(\"Gather payslips and the Employment Detail Summary\", \"Usually three recent payslips, your EDS from Revenue, and a salary certificate signed by your employer.\", true, \"1 week\", \"Free\",\n        [\"Three most recent payslips\", \"Employment Detail Summary from myAccount\", \"Salary certificate confirming contract type and any bonus\"],\n        \"Self-employed applicants need two years of certified accounts and a tax clearance certificate instead.\"),\n      T(\"Evidence rent and savings\", \"Rent plus regular saving is how you prove repayment capacity above your current outgoings.\", true, \"Ongoing\", \"Free\",\n        [\"Rent paid by standing order, visible on statements\", \"A savings pattern that has not been dipped into\", \"A short written explanation of any gap\"],\n        \"Rent plus savings should roughly equal the future mortgage repayment — that comparison is what underwriters run.\"),\n      T(\"Receive the AIP letter\", \"Approval in Principle states what the lender will lend, subject to valuation and final checks. It usually lasts six months.\", true, \"1–3 weeks\", \"Free\",\n        [\"Check the amount, the term and the expiry date\", \"Save a PDF to your phone for viewings\", \"Diary the expiry — renewing needs fresh statements\"],\n        \"No estate agent in Ireland will take a bid seriously without it.\"),\n    ] },\n  { n: \"03\", slug: \"search\", title: \"Search & Bidding\", subtitle: \"Daft.ie and MyHome.ie\",\n    text: \"Viewings, agent language and bids up to Sale Agreed.\",\n    tasks: [\n      T(\"Pick an area, check sold prices\", \"Asking prices are marketing. The Residential Property Price Register shows what actually closed.\", true, \"1 week\", \"Free\",\n        [\"Compare asking against the register, street by street\", \"Check the commute at the hour you would really travel\", \"Look at BER ratings — a C to a B can be €15,000 of work\"],\n        \"Set alerts on Daft and MyHome for your area and price band; good stock goes in days.\"),\n      T(\"Learn the Irish vocabulary\", \"The process has its own language, and agents will not slow down for you.\", false, \"1 evening\", \"Free\",\n        [\"Sale Agreed is not binding — gazumping stays possible until contracts\", \"Private treaty vs public auction changes the rules entirely\", \"Booking deposit is refundable; the contract deposit is not\"],\n        \"BER is legally required on every listing; no BER usually means no listing you should trust.\"),\n      T(\"Book viewings\", \"See at least five properties before you bid, including two you think are wrong.\", true, \"2–8 weeks\", \"Free\",\n        [\"Email the agent, then confirm by phone\", \"Photograph damp patches, meter boxes and the attic hatch\", \"Ask why the seller is moving and how long it has been listed\"],\n        \"Go back a second time on a wet weekday evening — houses look different when it rains and the road is busy.\"),\n      T(\"Log every bid\", \"Bidding is verbal and unregulated, so keep your own record.\", true, \"1–8 weeks\", \"Free\",\n        [\"Note the amount, the date and who you spoke to\", \"Set your walk-away number before you start\", \"Never bid without AIP in hand\"],\n        \"Ask the agent to confirm each bid by email — it keeps phantom bids honest.\"),\n      T(\"Reach Sale Agreed\", \"Your bid is accepted and you pay a booking deposit, usually €3,000–5,000, to take the house off the market.\", true, \"1 week\", \"€3,000–5,000 refundable\",\n        [\"Get the booking deposit receipt in writing\", \"Give the agent your solicitor's details\", \"Ask for the sales advice notice to be issued quickly\"],\n        \"The booking deposit is fully refundable until you sign contracts — this is not yet a done deal.\"),\n    ] },\n  { n: \"04\", slug: \"legal\", title: \"Legal & Contracts\", subtitle: \"Solicitor, survey and valuation\",\n    text: \"Contracts, survey, valuation and mandatory insurance.\",\n    tasks: [\n      T(\"Hire a solicitor\", \"Conveyancing is the legal transfer of title, and the timeline mostly runs at your solicitor's pace.\", true, \"1 week\", \"€2,000–3,000 + VAT\",\n        [\"Ask for a fixed quote including outlays and searches\", \"Ask how many files the firm closes per month\", \"Give them the sales advice notice as soon as it lands\"],\n        \"Pick on responsiveness, not price — the cheapest quote is rarely the one that answers the phone in August.\"),\n      T(\"Book the structural survey\", \"An independent engineer walks the house and writes up what is wrong with it.\", true, \"1–2 weeks\", \"€300–500\",\n        [\"Use an engineer on the Engineers Ireland or SCSI register\", \"Ask for photographs and a repair cost estimate\", \"For apartments, read the management company accounts too\"],\n        \"A survey finding is negotiating leverage: a €6,000 roof is a €6,000 conversation before contracts.\"),\n      T(\"Request the lender's valuation\", \"The bank values the property for its own security, from its own panel of valuers.\", true, \"1 week\", \"≈ €150\",\n        [\"Book it through the lender or broker, not privately\", \"It is a valuation, not a survey — it protects the bank, not you\", \"A down-valuation means you make up the gap in cash\"],\n        \"If the valuation comes in under the agreed price, the bid is renegotiable — that is a normal conversation.\"),\n      T(\"Take out mortgage protection and home insurance\", \"Both are mandatory before drawdown, and both can be bought away from the lender.\", true, \"1–2 weeks\", \"€25–60 per month\",\n        [\"Shop mortgage protection independently — the bank's quote is rarely cheapest\", \"Home insurance must cover the rebuild cost, not the purchase price\", \"Declare health conditions honestly; a void policy is worse than a loading\"],\n        \"Underwriting can take weeks if there is any medical history, so start it before contracts, not after.\"),\n      T(\"Sign contracts and pay the deposit\", \"You sign, pay the balance of the 10% deposit and the sale becomes legally binding.\", true, \"1–2 weeks\", \"10% less booking deposit\",\n        [\"Read the special conditions with your solicitor\", \"Agree a closing date that matches your notice period on rent\", \"Confirm what fixtures and fittings are included in writing\"],\n        \"From the moment contracts are exchanged, gazumping is off the table.\"),\n    ] },\n  { n: \"05\", slug: \"keys\", title: \"Keys in Hand\", subtitle: \"Drawdown and closing day\",\n    text: \"Loan offer, drawdown, closing day and the move.\",\n    tasks: [\n      T(\"Receive the final loan offer\", \"The formal offer replaces the AIP and sets the rate, the term and the conditions.\", true, \"1–2 weeks\", \"Free\",\n        [\"Check the rate, the term and any cashback conditions\", \"Compare fixed against variable one last time\", \"Sign and return with the insurance policies attached\"],\n        \"Green rates for a B3 BER or better can be worth several thousand over a fixed term.\"),\n      T(\"Draw down the funds\", \"Your solicitor requests the money for closing day and the lender pays it to them.\", true, \"3–10 days\", \"Free\",\n        [\"Confirm the exact closing balance with your solicitor\", \"Transfer your share early — same-day limits catch people out\", \"Check the first repayment date\"],\n        \"Never send money on emailed bank details alone; ring your solicitor's office to verify them.\"),\n      T(\"Close and collect the keys\", \"Title transfers, the balance is paid and the agent hands over the keys.\", true, \"1 day\", \"Closing balance\",\n        [\"Take meter readings and photograph them\", \"Get every key, fob and alarm code\", \"Change the locks in the first week\"],\n        \"Do a final walk-through before the money moves — the house should be in the condition you agreed.\"),\n      T(\"Walk the snag list\", \"New builds especially: log every defect while the builder is still on the hook.\", false, \"1 week\", \"€300–600 for a snagger\",\n        [\"Hire a professional snagger for a new build\", \"Photograph every item with a room name\", \"Send the list in writing with a deadline\"],\n        \"Keep the list open until each item is signed off; the warranty clock is already running.\"),\n    ] },\n  { n: \"06\", slug: \"settling\", title: \"Settling In\", subtitle: \"Floors, curtains and the boiler\",\n    text: \"The part nobody budgets for: furnishing and running the place.\",\n    tasks: [\n      T(\"Switch the utilities into your name\", \"Electricity, gas, broadband and bins, all in the first week.\", true, \"1 week\", \"Deposits vary\",\n        [\"Submit your day-one meter photos with each switch\", \"Switching supplier on move-in is the easiest discount you will ever get\", \"Set up the bin collection before the first Tuesday\"],\n        \"Register the alarm and check whether the broadband line is fibre before you commit to a plan.\"),\n      T(\"Register for Local Property Tax\", \"Revenue needs the property registered in your name, banded on its value.\", true, \"1 day\", \"Band-dependent\",\n        [\"Register through myAccount using the property ID\", \"Check whether the seller pre-paid the year\", \"Set the payment method you actually want\"],\n        \"Your solicitor confirms LPT compliance at closing, but the following year's return is yours.\"),\n      T(\"Set a furnishing budget by room\", \"The first €5,000 disappears into flooring and window coverings unless you plan it.\", false, \"1 evening\", \"€3,000–10,000\",\n        [\"Rank rooms: bedroom and kitchen first, spare room last\", \"Price flooring and blinds before sofas\", \"Leave 15% for the things you forget\"],\n        \"Second-hand solid furniture is cheaper and better than new flat-pack; measure doorways first.\"),\n      T(\"Floors before furniture\", \"Laying floors in an empty house is half the price and twice the speed.\", false, \"1–2 weeks\", \"€25–60 per m²\",\n        [\"Measure each room and add 10% for cuts\", \"Let laminate or engineered board acclimatise for 48 hours\", \"Sort underlay and skirting in the same order\"],\n        \"If you are painting too, paint first, floors second, skirting last.\"),\n      T(\"Measure for curtains and blinds\", \"Measure the rail, not the glass, and decide the length before you order.\", false, \"1 weekend\", \"€60–250 per window\",\n        [\"Rail width plus 15–20cm each side\", \"Sill length or floor length — decide per room\", \"Blackout in bedrooms, especially east-facing\"],\n        \"Order one room first and live with it for a week before doing the whole house.\"),\n      T(\"Service the boiler and test the alarms\", \"Get a baseline service and put safety checks on a calendar.\", false, \"1 day\", \"€90–150\",\n        [\"Book an RGI-registered engineer for gas\", \"Test smoke and CO alarms, replace anything over ten years old\", \"File the BER cert, warranties and manuals in one place\"],\n        \"Annual boiler servicing is a condition of most home insurance policies — keep the receipts.\"),\n    ] },\n];\n\nclass Component extends DCLogic {\n  state = {\n    screen: \"home\", done: {}, open: null,\n    ftb: true, joint: false,\n    salary: \"45000\", salary2: \"38000\", savings: \"35000\", gift: \"0\", htb: \"0\", price: \"380000\",\n    rate: \"3.9\", term: \"30\",\n  };\n\n  num(v) { return Number(v) || 0; }\n\n  euro(n) {\n    return \"€\" + Math.round(n).toLocaleString(\"en-IE\");\n  }\n\n  field(key) {\n    return (e) => this.setState({ [key]: e.target.value });\n  }\n\n  calc() {\n    const s = this.state;\n    const income = this.num(s.salary) + (s.joint ? this.num(s.salary2) : 0);\n    const multiple = s.ftb ? 4 : 3.5;\n    const depositRate = s.ftb ? 0.1 : 0.2;\n    const maxLoan = income * multiple;\n    const price = this.num(s.price);\n    const htbCap = Math.min(30000, price * 0.1);\n    const htb = s.ftb ? Math.min(this.num(s.htb), htbCap) : 0;\n    const funds = this.num(s.savings) + this.num(s.gift) + htb;\n    const loanLimitedPrice = maxLoan / (1 - depositRate);\n    const solicitor = 2500, survey = 400, valuation = 150;\n    const fixedFees = solicitor + survey + valuation;\n    const fundsLimitedPrice = Math.max(0, (funds - fixedFees) / (depositRate + 0.01));\n    const maxPrice = Math.min(loanLimitedPrice, fundsLimitedPrice);\n    const deposit = price * depositRate;\n    const stamp = price * 0.01;\n    const cashNeeded = deposit + stamp + fixedFees;\n    const loanNeeded = Math.max(0, price - deposit);\n    const r = this.num(s.rate) / 100 / 12;\n    const n = this.num(s.term) * 12;\n    const monthly = r > 0 && n > 0 ? (loanNeeded * r) / (1 - Math.pow(1 + r, -n)) : loanNeeded / (n || 1);\n    return { income, multiple, depositRate, maxLoan, price, htb, htbCap, funds, loanLimitedPrice,\n      fundsLimitedPrice, maxPrice, deposit, stamp, solicitor, survey, valuation, fixedFees,\n      cashNeeded, loanNeeded, monthly, gap: cashNeeded - funds };\n  }\n\n  flat() {\n    const out = [];\n    PHASES.forEach((p) => p.tasks.forEach((t, i) => out.push({ ...t, id: p.slug + \"-\" + i, blocking: t.blocking, phase: p })));\n    return out;\n  }\n\n  renderVals() {\n    const done = this.state.done;\n    const accent = this.props.accent ?? \"Moss & terracotta\";\n    const ink = accent === \"Slate & rust\" ? \"#34554f\" : accent === \"Peat & gold\" ? \"#4a3b22\" : \"#0f6b52\";\n    const inkDark = accent === \"Slate & rust\" ? \"#223b37\" : accent === \"Peat & gold\" ? \"#2f2515\" : \"#0a4c3a\";\n    const pop = accent === \"Peat & gold\" ? \"#8a5f1f\" : \"#b3521f\";\n    const popDark = accent === \"Peat & gold\" ? \"#5f4013\" : \"#8a3d14\";\n    const shape = this.props.nodeShape ?? \"Round\";\n    const radius = shape === \"Squircle\" ? \"22px\" : \"50%\";\n    const lift = (this.props.buttonLift ?? \"Pressed\") === \"Pressed\";\n\n    const flat = this.flat();\n    let unlocked = 0;\n    for (const t of flat) { if (t.blocking && !done[t.id]) break; unlocked += 1; }\n    const doneCount = flat.filter((t) => done[t.id]).length;\n    const pctNum = Math.round((doneCount / flat.length) * 100);\n    const streakN = Math.min(doneCount, 7);\n\n    const nav = (active) => \"background:none;border:0;padding:4px 0;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;color:\" +\n      (active ? \"#fffaf3\" : \"rgba(255,250,243,.78)\") + (active ? \";border-bottom:3px solid #f3b45f\" : \";border-bottom:3px solid transparent\");\n\n    const compact = !!this.state.open && this.state.screen === \"journey\";\n    let idx = -1;\n    const journey = PHASES.map((p) => {\n      const tasks = p.tasks.map((t, i) => {\n        idx += 1;\n        const id = p.slug + \"-\" + i;\n        const checked = !!done[id];\n        const locked = idx > unlocked;\n        const current = idx === unlocked && !checked;\n        const face = checked\n          ? \"background:\" + pop + \";color:#fff;\" + (lift ? \"box-shadow:0 5px 0 \" + popDark : \"\")\n          : locked\n            ? \"background:#f0e5d6;color:#a2917d;\" + (lift ? \"box-shadow:0 4px 0 #e0d2be\" : \"\")\n            : \"background:\" + ink + \";color:#fffaf3;\" + (lift ? \"box-shadow:0 5px 0 \" + inkDark : \"\");\n        const isOpen = this.state.open === id;\n        const nodeSize = compact ? 44 : 64;\n        return {\n          id, title: t.title,\n          liStyle: \"display:flex;flex-direction:column;align-items:center;transform:translateX(\" + Math.round(WAVE[idx % WAVE.length] * (compact ? 0.34 : 1)) + \"px)\",\n          nodeStyle: \"width:\" + nodeSize + \"px;height:\" + nodeSize + \"px;border:0;border-radius:\" + (compact && shape === \"Squircle\" ? \"14px\" : radius) +\n            \";display:grid;place-items:center;font-family:inherit;font-weight:800;font-size:\" + (compact ? \"17px\" : \"24px\") + \";transition:transform .12s;cursor:\" +\n            (locked ? \"not-allowed\" : \"pointer\") + \";\" + face +\n            (current && !compact ? \";outline:5px solid #cfe7dd;outline-offset:4px;animation:eh-bob 2.4s ease-in-out infinite\" : \"\") +\n            (isOpen ? \";outline:4px solid \" + pop + \";outline-offset:3px\" : \"\"),\n          glyph: checked ? \"✓\" : locked ? \"🔒\" : t.blocking ? \"★\" : \"◆\",\n          callout: current ? \"Start here\" : (!t.blocking && !checked ? \"Optional\" : \"\"),\n          calloutStyle: compact ? \"display:none\" : (current\n            ? \"margin-bottom:10px;padding:5px 12px;border-radius:999px;background:\" + pop + \";color:#fff;font-weight:800;font-size:12px\"\n            : (!t.blocking && !checked ? \"margin-bottom:10px;padding:5px 12px;border-radius:999px;background:#f3ece1;color:#8a7a66;font-weight:700;font-size:12px\" : \"display:none\")),\n          labelStyle: \"margin-top:\" + (compact ? \"7px\" : \"12px\") + \";max-width:\" + (compact ? \"15ch\" : \"20ch\") + \";text-align:center;font-weight:700;font-size:\" +\n            (compact ? \"12px\" : \"14px\") + \";line-height:1.3;color:\" +\n            (locked ? \"#a2917d\" : checked ? \"#8a7a66\" : \"#2c2118\") + (checked ? \";text-decoration:line-through\" : \"\"),\n          open: locked ? () => {} : () => this.setState({ open: id }),\n        };\n      });\n      const dn = tasks.filter((t) => done[t.id]).length;\n      const allDone = dn === tasks.length;\n      return {\n        n: p.n, title: p.title, subtitle: p.subtitle, pctLabel: dn + \" / \" + tasks.length,\n        badgeStyle: \"display:grid;place-items:center;width:44px;height:44px;border-radius:\" + (shape === \"Squircle\" ? \"14px\" : \"50%\") + \";font-weight:800;font-size:16px;flex:none;\" +\n          (allDone ? \"background:\" + pop + \";color:#fff\" : dn ? \"background:\" + ink + \";color:#fffaf3\" : \"background:#fff;color:#7d6b55;border:2px solid #e4d8c8\"),\n        tasks,\n      };\n    });\n\n    const next = flat[unlocked];\n    const openTask = flat.find((t) => t.id === this.state.open);\n    const ringLen = 2 * Math.PI * 43;\n\n    const c = this.calc();\n    const s = this.state;\n    const pill = (on) => \"flex:1;padding:11px 14px;border-radius:999px;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer;border:2px solid \" +\n      (on ? ink : \"#e4d8c8\") + \";background:\" + (on ? ink : \"#fff\") + \";color:\" + (on ? \"#fffaf3\" : \"#8a7a66\");\n    const row = (strong) => \"display:flex;justify-content:space-between;gap:16px;align-items:baseline;padding:11px 0;border-bottom:\" +\n      (strong ? \"0\" : \"1px solid #f3ece1\");\n    const lbl = (strong) => \"font-size:15px;color:\" + (strong ? \"#2c2118\" : \"#6b5a48\") + \";font-weight:\" + (strong ? \"800\" : \"600\");\n    const val = (strong) => \"font-weight:800;font-size:\" + (strong ? \"19px\" : \"16px\") + \";color:\" + (strong ? ink : \"#2c2118\");\n\n    return {\n      onHome: this.state.screen === \"home\",\n      onJourney: this.state.screen === \"journey\",\n      onCalc: this.state.screen === \"calc\",\n      navHomeStyle: nav(this.state.screen === \"home\"),\n      navJourneyStyle: nav(this.state.screen === \"journey\"),\n      navCalcStyle: nav(this.state.screen === \"calc\"),\n      goHome: () => this.setState({ screen: \"home\" }),\n      goJourney: () => this.setState({ screen: \"journey\" }),\n      goCalc: () => this.setState({ screen: \"calc\" }),\n\n      fSalary: s.salary, fSalary2: s.salary2, fSavings: s.savings, fGift: s.gift, fHtb: s.htb,\n      fPrice: s.price, fRate: s.rate, fTerm: s.term,\n      onSalary: this.field(\"salary\"), onSalary2: this.field(\"salary2\"), onSavings: this.field(\"savings\"),\n      onGift: this.field(\"gift\"), onHtb: this.field(\"htb\"), onPrice: this.field(\"price\"),\n      onRate: this.field(\"rate\"), onTerm: this.field(\"term\"),\n      setFtb: () => this.setState({ ftb: true }),\n      setMover: () => this.setState({ ftb: false }),\n      setSingle: () => this.setState({ joint: false }),\n      setJoint: () => this.setState({ joint: true }),\n      ftbOnStyle: pill(s.ftb), ftbOffStyle: pill(!s.ftb),\n      singleStyle: pill(!s.joint), jointStyle: pill(s.joint),\n      partnerFieldStyle: s.joint ? \"display:block\" : \"display:none\",\n      htbFieldStyle: s.ftb ? \"display:block\" : \"display:none\",\n      htbHint: s.ftb\n        ? \"Help to Buy is capped at €30,000 or 10% of the price, new builds only — on this price that is \" + this.euro(c.htbCap) + \".\"\n        : \"Help to Buy is first-time buyers only, so it is not counted here.\",\n      htbHintStyle: \"margin:0;padding:12px 14px;border-radius:14px;background:#fdf2e4;font-size:13px;line-height:1.5;color:#8a5a2a\",\n      multipleLabel: c.multiple + \"×\",\n      maxLoan: this.euro(c.maxLoan),\n      funds: this.euro(c.funds),\n      maxPrice: this.euro(c.maxPrice),\n      limitNote: c.fundsLimitedPrice < c.loanLimitedPrice\n        ? \"Right now your cash is the limit, not your income. Every extra €1,000 saved lifts this by about \" + this.euro(1000 / (c.depositRate + 0.01)) + \".\"\n        : \"Right now your income is the limit — the \" + c.multiple + \"× rule caps the loan at \" + this.euro(c.maxLoan) + \".\",\n      priceLabel: this.euro(c.price),\n      breakdown: [\n        { label: \"Deposit (\" + Math.round(c.depositRate * 100) + \"%)\", value: this.euro(c.deposit) },\n        { label: \"Mortgage needed\", value: this.euro(c.loanNeeded) },\n        { label: \"Stamp duty (1%)\", value: this.euro(c.stamp) },\n        { label: \"Solicitor\", value: \"≈ \" + this.euro(c.solicitor) },\n        { label: \"Structural survey\", value: \"≈ \" + this.euro(c.survey) },\n        { label: \"Bank valuation\", value: \"≈ \" + this.euro(c.valuation) },\n        { label: \"Total cash you need\", value: this.euro(c.cashNeeded), strong: true },\n      ].map((b) => ({ label: b.label, value: b.value, rowStyle: row(!!b.strong), labelStyle: lbl(!!b.strong), valueStyle: val(!!b.strong) })),\n      bookingNote: \"To secure the house you pay a booking deposit of roughly €5,000 (refundable until contracts are signed); the rest of the \" +\n        this.euro(c.deposit) + \" deposit is due when you sign.\",\n      verdictStyle: \"padding:22px 26px;border-radius:24px;background:\" + (c.gap > 0 ? \"#fdf2e4\" : \"#e8f1ec\") + \";border:2px solid \" + (c.gap > 0 ? \"#f0dcc0\" : \"#cfe2d7\"),\n      verdictTitle: c.gap > 0 ? \"You are \" + this.euro(c.gap) + \" short\" : \"Your cash covers this purchase\",\n      verdictBody: c.gap > 0\n        ? \"You have \" + this.euro(c.funds) + \" available and need \" + this.euro(c.cashNeeded) + \" in cash at this price. Either save the difference or aim closer to \" + this.euro(c.maxPrice) + \".\"\n        : c.loanNeeded > c.maxLoan\n          ? \"But the mortgage needed (\" + this.euro(c.loanNeeded) + \") is above your \" + c.multiple + \"× ceiling of \" + this.euro(c.maxLoan) + \". Aim at or below \" + this.euro(c.maxPrice) + \".\"\n          : \"You have \" + this.euro(c.funds) + \" against \" + this.euro(c.cashNeeded) + \" needed, and the loan sits inside your \" + c.multiple + \"× ceiling. Next step: gather the AIP paperwork.\",\n      monthly: this.euro(c.monthly),\n      monthlyNote: this.euro(c.loanNeeded) + \" over \" + this.num(s.term) + \" years at \" + this.num(s.rate) + \"%. Mortgage protection and home insurance are on top.\",\n      reset: () => this.setState({ done: {}, open: null }),\n      resumeLabel: doneCount ? \"Resume my journey\" : \"Start my journey\",\n      tickerLoop: [...TICKER, ...TICKER].map((text, i) => ({ text, key: i })),\n      phaseRows: PHASES.map((p) => {\n        const dn = p.tasks.filter((t, i) => done[p.slug + \"-\" + i]).length;\n        const pc = Math.round((dn / p.tasks.length) * 100);\n        return {\n          n: p.n, title: p.title, text: p.text, progress: dn + \" of \" + p.tasks.length + \" steps done\",\n          cardStyle: \"text-align:left;padding:22px;border-radius:22px;background:#fff;border:2px solid #efe2d1;font-family:inherit;color:inherit;cursor:pointer;transition:transform .14s\",\n          badgeStyle: \"display:grid;place-items:center;width:46px;height:46px;border-radius:\" + (shape === \"Squircle\" ? \"14px\" : \"50%\") + \";font-weight:800;font-size:17px;flex:none;\" +\n            (dn ? \"background:\" + ink + \";color:#fffaf3\" : \"background:#f3ece1;color:#7d6b55\"),\n          barStyle: \"display:block;height:100%;width:\" + pc + \"%;border-radius:999px;background:\" + (pc === 100 ? pop : ink) + \";transition:width .25s\",\n          open: () => this.setState({ screen: \"journey\" }),\n        };\n      }),\n      journey,\n      pct: pctNum + \"%\",\n      countLabel: doneCount + \" of \" + flat.length + \" steps\",\n      ringDash: (ringLen * pctNum / 100).toFixed(1) + \" \" + ringLen.toFixed(1),\n      streak: doneCount ? streakN + (streakN === 1 ? \" day\" : \" days\") : \"—\",\n      xp: doneCount * 25,\n      nextTitle: next ? next.title : \"Put the kettle on\",\n      openNext: () => this.setState({ screen: \"journey\", open: next ? next.id : null }),\n      hasOpen: !!openTask,\n      compact,\n      journeyGridStyle: \"display:grid;grid-template-columns:\" + (compact ? \"minmax(0,300px) minmax(0,1fr)\" : \"minmax(0,1fr) 300px\") +\n        \";gap:\" + (compact ? \"36px\" : \"56px\") + \";align-items:start\",\n      journeyHeadStyle: compact ? \"display:none\" : \"display:block\",\n      asideStyle: compact ? \"display:none\" : \"position:sticky;top:104px\",\n      openPhase: openTask ? openTask.phase.n + \" · \" + openTask.phase.title : \"\",\n      openTitle: openTask ? openTask.title : \"\",\n      openBody: openTask ? openTask.body : \"\",\n      openTime: openTask ? openTask.time : \"\",\n      openCost: openTask ? openTask.cost : \"\",\n      openTip: openTask ? openTask.tip : \"\",\n      openChecklist: openTask ? openTask.checklist.map((text, i) => ({ text, key: i })) : [],\n      openStepLabel: openTask ? \"Step \" + (flat.indexOf(openTask) + 1) + \" of \" + flat.length : \"\",\n      openTag: openTask && !openTask.blocking ? \"Optional step\" : \"Blocking step\",\n      openTagStyle: openTask && !openTask.blocking\n        ? \"display:inline-block;margin:0;padding:5px 12px;border-radius:999px;background:#f3ece1;color:#8a7a66;font-weight:700;font-size:12px\"\n        : \"display:inline-block;margin:0;padding:5px 12px;border-radius:999px;background:\" + pop + \";color:#fff;font-weight:800;font-size:12px\",\n      openAction: openTask && done[openTask.id] ? \"Mark as not done\" : \"Complete step  +25 XP\",\n      openPrev: () => {\n        const i = flat.indexOf(openTask);\n        if (i > 0) this.setState({ open: flat[i - 1].id });\n      },\n      openNextStep: () => {\n        const i = flat.indexOf(openTask);\n        if (i > -1 && i < flat.length - 1 && i + 1 <= unlocked) this.setState({ open: flat[i + 1].id });\n      },\n      toggleOpen: () => this.setState((s) => ({ done: { ...s.done, [s.open]: !s.done[s.open] } })),\n      close: () => this.setState({ open: null }),\n      stop: (e) => e.stopPropagation(),\n      finishStyle: \"display:grid;place-items:center;width:88px;height:88px;border-radius:\" + (shape === \"Squircle\" ? \"26px\" : \"50%\") + \";font-size:36px;\" +\n        (pctNum === 100 ? \"background:\" + pop + \";color:#fff;box-shadow:0 6px 0 \" + popDark : \"background:#f3ece1;color:#c3b39c;border:3px dashed #ddcdb6\"),\n      finishTitle: pctNum === 100 ? \"Home.\" : \"Home, fully settled\",\n      finishNote: pctNum === 100 ? \"Every step done — floors, curtains and all.\" : \"Unlocks when every blocking step is ticked.\",\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
